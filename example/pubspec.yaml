name: idz_flutter_example
description: "Example app demonstrating the IDz Flutter SDK for KYC verification."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  idz_flutter:
    path: ../

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
