name: idz_flutter
description: "Flutter SDK for the IDz KYC verification API — Algerian national ID + driving licence, with face match and passive liveness."
version: 0.1.3
homepage: https://idz.holool.dev
repository: https://github.com/holool/idz-flutter-sdk
issue_tracker: https://github.com/holool/idz-flutter-sdk/issues

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  crypto: ^3.0.5
  camera: ^0.11.0
  image_picker: ^1.0.0
  flutter_image_compress: ^2.1.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  dmrtd:
    git:
      url: https://github.com/ZeroPass/dmrtd.git
      ref: master
  intl: ^0.19.0

dev_dependencies:
  camera_platform_interface: ^2.13.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
  mocktail: ^1.0.0
  plugin_platform_interface: ^2.1.8
  http_mock_adapter: ^0.6.0

flutter:
